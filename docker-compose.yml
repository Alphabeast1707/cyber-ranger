networks:
  cyberranger_internal:
    name: cyberranger_internal
    internal: true   # no route to the outside — this is the load-bearing line

services:
  dvwa-target:
    image: vulnerables/web-dvwa
    networks:
      - cyberranger_internal
    # no ports: mapping to the host in the default profile — expose only for manual debugging

  blue-detector:
    build: ./blue_detector
    networks:
      - cyberranger_internal
    volumes:
      - ./blue_detector/models:/app/models   # swapped by blue_learner after retraining

  dev-proxy:
    image: alpine/socat
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8000:8000"
    entrypoint: ["sh", "-c", "socat TCP-LISTEN:8080,fork,reuseaddr TCP:dvwa-target:80 & socat TCP-LISTEN:8000,fork,reuseaddr TCP:blue-detector:8000 & wait"]
    networks:
      - default
      - cyberranger_internal
