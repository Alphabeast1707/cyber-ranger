[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberranger"
version = "0.1.0"
description = "Red-vs-blue co-evolutionary security research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pydantic>=2.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "anthropic>=0.9.0"
]

[project.scripts]
cyberranger = "scripts.cyberranger_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cyberranger*", "scripts*"]

[tool.pytest.ini_options]

pythonpath = ["."]
